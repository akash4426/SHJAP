name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — typecheck + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '1234'
          POSTGRES_DB: shjap_grievance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (workspaces)
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend
      - name: Unit + integration tests
        run: npx vitest run
        working-directory: backend

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (workspaces)
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend
